[project]
name = "c2p-backend"
version = "0.1.0"
description = "C2P backend – FastAPI service"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Settings & validation
    "pydantic-settings>=2.4.0",

    # Postgres – async SQLAlchemy + asyncpg driver
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # MongoDB – async Motor (includes GridFS)
    "motor>=3.5.0",

    # Qdrant
    "qdrant-client>=1.11.0",

    # Gemini
    "google-genai>=1.0.0",

    # Structured JSON logging
    "python-json-logger>=2.0.7",

    # Misc
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
